name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional Maven test selector (e.g. -Dtest=CompactHashMapTest -Dsurefire.failIfNoSpecifiedTests=false); empty runs the full suite'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    permissions:
      actions: write  # for styfle/cancel-workflow-action to cancel/stop running workflows
      contents: read  # for actions/checkout to fetch code
    name: "${{ matrix.root-pom }} on JDK ${{ matrix.java }} on ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        java: [ 8, 11, 17, 21 ]
        root-pom: [ 'pom.xml', 'android/pom.xml' ]
        include:
          - os: windows-latest
            java: 21
            root-pom: pom.xml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      ROOT_POM: ${{ matrix.root-pom }}
      # Retry transient Maven Central gateway errors (a 502 on one artifact otherwise kills the leg).
      MAVEN_ARGS: -Daether.transport.http.retryHandler.count=5 -Daether.transport.http.retryHandler.serviceUnavailable=429,500,502,503,504
    steps:
      # Cancel any previous runs for the same branch that are still running.
      - name: 'Cancel previous runs'
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1
        with:
          access_token: ${{ github.token }}
      - name: 'Check out repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # When we specify multiple JDKs, the final one becomes the default, which is used to execute Maven itself.
      # Our Maven configuration then specifies different JDKs to use for some of the steps:
      # - 11 (sometimes) to *download* to support anyone who runs JDiff or our Gradle integration tests (including our doc snapshots and our Java 11 CI test run) but not to use directly
      # - 26 for running Javadoc and javac (to help people who build Guava locally and might not use a recent JDK to run Maven)
      - name: 'Set up JDKs'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: |
            ${{ matrix.java }}
            26
          distribution: 'temurin'
          cache: 'maven'
      - name: 'Install'
        shell: bash
        run: ./mvnw -B -ntp -Dtoolchain.skip install -U -DskipTests=true -f $ROOT_POM
      - name: 'Test'
        shell: bash
        run: ./mvnw -B -ntp -P!standard-with-extra-repos -Dtoolchain.skip verify -U -Dmaven.javadoc.skip=true -Dsurefire.toolchain.version=${{ matrix.java }} -f $ROOT_POM ${{ inputs.test-filter }}
      - name: 'Summarize Surefire results (per-module counts and skipped tests with reasons)'
        if: ${{ always() }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          "$PY" - <<'PY'
          import glob, xml.etree.ElementTree as ET
          from collections import defaultdict
          tot = defaultdict(lambda: [0, 0, 0, 0])
          skipped = []
          for f in sorted(glob.glob('android/*/target/surefire-reports/TEST-*.xml') + glob.glob('*/target/surefire-reports/TEST-*.xml')):
              f = f.replace('\\', '/')
              mod = f.split('/target/')[0]
              r = ET.parse(f).getroot()
              t = tot[mod]
              t[0] += int(r.get('tests', 0)); t[1] += int(r.get('failures', 0)); t[2] += int(r.get('errors', 0)); t[3] += int(r.get('skipped', 0))
              for tc in r.iter('testcase'):
                  sk = tc.find('skipped')
                  if sk is not None:
                      skipped.append((mod, tc.get('classname'), tc.get('name'), (sk.get('message') or sk.text or 'no message').strip().replace('\n', ' ')[:300]))
          for mod, (n, fl, er, sk) in sorted(tot.items()):
              print(f'SUREFIRE SUMMARY {mod}: tests={n} passed={n - fl - er - sk} failures={fl} errors={er} skipped={sk}')
          print(f'SKIPPED TESTS ({len(skipped)}):')
          for s in skipped:
              print('SKIPPED %s %s#%s reason: %s' % s)
          PY
      - name: 'Print Surefire reports'
        # Note: Normally a step won't run if the job has failed, but this causes it to
        if: ${{ failure() }}
        shell: bash
        run: ./util/print_surefire_reports.sh
      - name: 'Set up Gradle'
        if: matrix.java == 11 # used only by the integration tests below
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
      - name: 'Integration Test'
        if: matrix.java == 11
        shell: bash
        run: util/gradle_integration_tests.sh
      # Release jar: Maven on JDK 17 with the pom's toolchain (javac 26), as the published jar (Build-Jdk-Spec: 17) was built.
      - name: 'Package release jar'
        if: matrix.java == 17 && matrix.root-pom == 'pom.xml' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: JAVA_HOME="$JAVA_HOME_17_X64" ./mvnw -B -ntp clean package -pl guava -DskipTests=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true
      - name: 'Upload release jar'
        if: matrix.java == 17 && matrix.root-pom == 'pom.xml' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: guava-jar
          path: guava/target/guava-33.6.0-jre.jar
          if-no-files-found: error

  publish_snapshot:
    name: 'Publish snapshot'
    needs: test
    if: github.event_name == 'push' && github.repository == 'google/guava'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: 'Set up JDKs'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          # For discussion, see the first setup-java block.
          # The publish-snapshot workflow doesn't run tests, so we don't have to care which version Maven would select for that step.
          java-version: 26
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD
      - name: 'Publish'
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
        run: ./util/deploy_snapshot.sh

  generate_docs:
    permissions:
      contents: write
    name: 'Generate latest docs'
    needs: test
    if: github.event_name == 'push' && github.repository == 'google/guava'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: 'Set up JDKs'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          # For discussion, see the first setup-java block.
          # The generate-docs workflow doesn't run tests, so we don't have to care which version Maven would select for that step.
          # But we need Java 11 for JDiff.
          java-version: |
            11
            26
          distribution: 'temurin'
          cache: 'maven'
      - name: 'Generate latest docs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./util/update_snapshot_docs.sh
